{% extends 'base_teacher_portal.html' %}

{% block title %}새 지시사항 - M'Class{% endblock %}

{% block content %}
<div class="space-y-6">
    <!-- 헤더 -->
    <div class="flex justify-between items-center">
        <h2 class="text-2xl font-bold text-gray-800">새 지시사항</h2>
        <a href="{% url 'teachers:message_list' %}"
           class="text-gray-600 hover:text-gray-800">
            취소
        </a>
    </div>

    <!-- 폼 -->
    <div class="bg-white rounded-lg shadow overflow-hidden">
        <form method="POST" class="p-6 space-y-6">
            {% csrf_token %}

            <!-- 수신자 선택 -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    받는 사람
                </label>
                <select name="recipient"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                    <option value="">전체 공지 (모든 선생님)</option>
                    {% for teacher in teachers %}
                    <option value="{{ teacher.user.pk }}"
                            {% if selected_teacher_id == teacher.pk %}selected{% endif %}>
                        {{ teacher.name }} 선생님
                    </option>
                    {% endfor %}
                </select>
            </div>

            <!-- 관련 학생 선택 -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    관련 학생 (선택사항)
                </label>
                <select name="student"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                    <option value="">선택 안함</option>
                    {% for student in students %}
                    <option value="{{ student.pk }}"
                            {% if selected_student_id == student.pk %}selected{% endif %}>
                        {{ student.name }} ({{ student.school.name|default:"-" }} {{ student.grade|default:"" }})
                    </option>
                    {% endfor %}
                </select>
                <p class="mt-1 text-xs text-gray-500">특정 학생에 대한 지시사항인 경우 선택하세요.</p>
            </div>

            <!-- 제목 -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    제목 <span class="text-red-500">*</span>
                </label>
                <input type="text"
                       name="title"
                       required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                       placeholder="메시지 제목을 입력하세요">
            </div>

            <!-- 내용 -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    내용 <span class="text-red-500">*</span>
                </label>
                <textarea name="content"
                          required
                          rows="8"
                          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                          placeholder="메시지 내용을 입력하세요..."></textarea>
            </div>

            <!-- 제출 버튼 -->
            <div class="flex justify-end gap-4 pt-4 border-t border-gray-200">
                <a href="{% url 'teachers:message_list' %}"
                   class="px-6 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors">
                    취소
                </a>
                <button type="submit"
                        class="px-6 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg transition-colors">
                    메시지 보내기
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
