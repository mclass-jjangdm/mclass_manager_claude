{% extends 'base_teacher_portal.html' %}

{% block title %}메시지 삭제 - M'Class{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">
    <div class="bg-white rounded-lg shadow overflow-hidden">
        <div class="px-6 py-4 bg-red-50 border-b border-red-100">
            <h2 class="text-xl font-bold text-red-700">메시지 삭제</h2>
        </div>

        <div class="p-6">
            <p class="text-gray-700 mb-4">
                다음 메시지를 삭제하시겠습니까?
            </p>

            <div class="bg-gray-50 rounded-lg p-4 mb-6">
                <div class="text-sm text-gray-500 mb-1">{{ message.get_message_type_display }}</div>
                <div class="font-medium text-gray-900">{{ message.title }}</div>
                <div class="text-sm text-gray-600 mt-2 line-clamp-3">{{ message.content|truncatewords:30 }}</div>
            </div>

            <form method="POST" class="flex gap-4">
                {% csrf_token %}
                <a href="{% url 'teachers:message_detail' message.pk %}"
                   class="flex-1 px-4 py-2 border border-gray-300 rounded-lg text-center text-gray-700 hover:bg-gray-50 transition-colors">
                    취소
                </a>
                <button type="submit"
                        class="flex-1 px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg transition-colors">
                    삭제
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
