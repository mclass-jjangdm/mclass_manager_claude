{% extends 'base_teacher_portal.html' %}

{% block title %}비밀번호 변경 - M'Class 선생님 포털{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-white shadow rounded-lg">
        <div class="px-6 py-4 border-b border-gray-200">
            <h1 class="text-xl font-semibold text-gray-800">비밀번호 변경</h1>
            <p class="text-sm text-gray-500 mt-1">새로운 비밀번호를 설정해 주세요.</p>
        </div>

        <form method="post" class="p-6 space-y-4">
            {% csrf_token %}

            <div>
                <label for="current_password" class="block text-sm font-medium text-gray-700 mb-1">
                    현재 비밀번호
                </label>
                <input type="password" name="current_password" id="current_password" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
                       placeholder="현재 비밀번호를 입력하세요">
            </div>

            <div>
                <label for="new_password" class="block text-sm font-medium text-gray-700 mb-1">
                    새 비밀번호
                </label>
                <input type="password" name="new_password" id="new_password" required minlength="4"
                       class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
                       placeholder="새 비밀번호 (4자 이상)">
            </div>

            <div>
                <label for="new_password_confirm" class="block text-sm font-medium text-gray-700 mb-1">
                    새 비밀번호 확인
                </label>
                <input type="password" name="new_password_confirm" id="new_password_confirm" required minlength="4"
                       class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
                       placeholder="새 비밀번호를 다시 입력하세요">
            </div>

            <div class="flex items-center justify-between pt-4">
                <a href="{% url 'progress:my_progress' %}"
                   class="text-gray-600 hover:text-gray-800 text-sm">
                    취소
                </a>
                <button type="submit"
                        class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                    비밀번호 변경
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
