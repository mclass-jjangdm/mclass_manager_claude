{% extends 'students/base_students.html' %}

{% block title %}학생 데이터 내보내기 - {{ block.super }}{% endblock %}

{% block student_content %}
<div class="content-card max-w-2xl mx-auto">
    <div class="card-header">
        <h1 class="text-xl font-semibold text-gray-900">학생 데이터 내보내기</h1>
    </div>

    <div class="card-body">
        <form method="post" class="space-y-8">
            {% csrf_token %}

            <!-- 1. 대상 범위 -->
            <div>
                <h3 class="text-sm font-semibold text-gray-800 mb-3">1. 내보낼 학생 범위</h3>
                <div class="space-y-2">
                    <label class="flex items-center gap-2 text-sm text-gray-700">
                        <input type="radio" name="scope" value="active" checked
                               class="text-indigo-600 focus:ring-indigo-500">
                        재원생만 (기본)
                    </label>
                    <label class="flex items-center gap-2 text-sm text-gray-700">
                        <input type="radio" name="scope" value="all"
                               class="text-indigo-600 focus:ring-indigo-500">
                        퇴원생 포함 전체
                    </label>
                </div>
            </div>

            <!-- 2. 포함 항목 -->
            <div>
                <h3 class="text-sm font-semibold text-gray-800 mb-3">2. 내보낼 항목</h3>
                <p class="text-sm text-gray-500 mb-2">이름과 전화번호는 항상 포함됩니다.</p>
                <label class="flex items-center gap-2 text-sm text-gray-700">
                    <input type="checkbox" name="include_email"
                           class="rounded text-indigo-600 focus:ring-indigo-500">
                    이메일 주소도 포함
                </label>
            </div>

            <div class="flex justify-end space-x-4 pt-4 border-t border-gray-200">
                <a href="{% url 'students:student_list' %}"
                   class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50">
                    취소
                </a>
                <button type="submit" class="form-button">
                    엑셀 파일 내보내기
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
