<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모의고사 성적 입력 - {{ student.name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
<div class="max-w-2xl mx-auto py-6 px-4">

    <!-- 헤더 -->
    <div class="text-center mb-6">
        <a href="https://mclass.co.kr/" class="hover:opacity-75 transition-opacity">
            <h1 class="text-2xl font-bold text-gray-800">엠클래스 수학과학전문학원</h1>
        </a>
    </div>

    <!-- 학생 정보 -->
    <div class="bg-white rounded-xl shadow-md p-4 mb-5 flex items-center justify-between">
        <div>
            <p class="text-xs text-gray-400">학생</p>
            <p class="text-lg font-bold text-gray-900">{{ student.name }}</p>
        </div>
        <a href="{% url 'parent_grades' student.pk %}"
           class="px-3 py-1.5 border border-gray-300 text-gray-600 rounded-lg hover:bg-gray-50 text-sm font-medium">
            ← 돌아가기
        </a>
    </div>

    <h2 class="text-base font-bold text-gray-800 mb-4">📄 모의고사 성적 입력</h2>

    {% if error_message %}
    <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl mb-4 text-sm">{{ error_message }}</div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 space-y-4">

            <!-- 학년 / 시험연도 / 월 -->
            <div class="grid grid-cols-3 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">학년 <span class="text-red-500">*</span></label>
                    <select name="year" required class="w-full border border-gray-300 rounded-lg px-2 py-2.5 text-sm focus:ring-2 focus:ring-green-400 focus:outline-none">
                        <option value="">-</option>
                        <option value="1">1학년</option>
                        <option value="2">2학년</option>
                        <option value="3">3학년</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">시험 연도 <span class="text-red-500">*</span></label>
                    <select name="exam_year" required class="w-full border border-gray-300 rounded-lg px-2 py-2.5 text-sm focus:ring-2 focus:ring-green-400 focus:outline-none">
                        <option value="">-</option>
                        {% for y in exam_years %}
                        <option value="{{ y }}" {% if y == current_year %}selected{% endif %}>{{ y }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">월 <span class="text-red-500">*</span></label>
                    <select name="exam_month" required class="w-full border border-gray-300 rounded-lg px-2 py-2.5 text-sm focus:ring-2 focus:ring-green-400 focus:outline-none">
                        <option value="">-</option>
                        {% for m in exam_months %}
                        <option value="{{ m }}">{{ m }}월</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <!-- 시험명 -->
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">시험명 (선택)</label>
                <input type="text" name="exam_name" placeholder="예: 3월 교육청 모의고사"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-green-400 focus:outline-none">
            </div>

            <!-- 과목 -->
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">과목 <span class="text-red-500">*</span></label>
                <select name="subject" required class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-green-400 focus:outline-none">
                    <option value="">-- 과목 선택 --</option>
                    {% for s in subjects %}
                    <option value="{{ s.pk }}">[{{ s.subject_code }}] {{ s.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- 원점수 / 과목평균 / 등급 -->
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">원점수 <span class="text-red-500">*</span></label>
                    <input type="number" name="score" placeholder="0~100" required
                           min="0" max="100" step="0.01"
                           class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-green-400 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">과목 평균</label>
                    <input type="number" name="subject_average" placeholder="(선택)"
                           min="0" max="100" step="0.01"
                           class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-green-400 focus:outline-none">
                </div>
                <div class="col-span-2 sm:col-span-1">
                    <label class="block text-xs font-semibold text-gray-600 mb-1">등급</label>
                    <select name="grade_rank"
                            class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-green-400 focus:outline-none">
                        <option value="">-</option>
                        {% for n in grade_ranks %}
                        <option value="{{ n }}">{{ n }}등급</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        </div>

        <!-- 저장 / 취소 -->
        <div class="flex gap-3 mt-5">
            <a href="{% url 'parent_grades' student.pk %}"
               class="flex-1 py-3 bg-white border border-gray-300 text-gray-600 rounded-xl text-sm font-medium text-center hover:bg-gray-50 transition-colors">
                취소
            </a>
            <button type="submit"
                    class="flex-grow-[2] py-3 bg-green-500 text-white rounded-xl text-sm font-bold hover:bg-green-600 transition-colors">
                저장하기
            </button>
        </div>
    </form>

    <!-- 푸터 -->
    <div class="text-center mt-8 text-xs text-gray-400 pb-4">
        <p>엠클래스 수학과학전문학원 · 031-439-1222</p>
    </div>
</div>
</body>
</html>
