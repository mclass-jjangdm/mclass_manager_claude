<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한 학기 내신 성적 입력 - {{ student.name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
<div class="max-w-2xl mx-auto py-6 px-4">

    <!-- 헤더 -->
    <div class="text-center mb-6">
        <a href="https://mclass.co.kr/" class="hover:opacity-75 transition-opacity">
            <h1 class="text-2xl font-bold text-gray-800">엠클래스 수학과학전문학원</h1>
        </a>
    </div>

    <!-- 학생 정보 -->
    <div class="bg-white rounded-xl shadow-md p-4 mb-5 flex items-center justify-between">
        <div>
            <p class="text-xs text-gray-400">학생</p>
            <p class="text-lg font-bold text-gray-900">{{ student.name }}</p>
        </div>
        <a href="{% url 'parent_grades' student.pk %}"
           class="px-3 py-1.5 border border-gray-300 text-gray-600 rounded-lg hover:bg-gray-50 text-sm font-medium">
            ← 돌아가기
        </a>
    </div>

    <div class="flex items-center gap-2 mb-4">
        <h2 class="text-base font-bold text-gray-800">📋 한 학기 내신 성적 일괄 입력</h2>
        <span class="text-xs font-medium text-green-600 bg-green-50 px-2 py-0.5 rounded-full">중학교</span>
    </div>

    {% if error_message %}
    <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl mb-4 text-sm">{{ error_message }}</div>
    {% endif %}

    <form method="POST" id="bulk-form">
        {% csrf_token %}
        <input type="hidden" name="grade_count" id="grade_count" value="0">

        <!-- 학년 / 학기 선택 -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 mb-4">
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">학년 <span class="text-red-500">*</span></label>
                    <select name="year" required
                            class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-green-400 focus:outline-none">
                        <option value="">선택</option>
                        <option value="1">1학년</option>
                        <option value="2">2학년</option>
                        <option value="3">3학년</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">학기 <span class="text-red-500">*</span></label>
                    <select name="semester" required
                            class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-green-400 focus:outline-none">
                        <option value="">선택</option>
                        <option value="1">1학기</option>
                        <option value="2">2학기</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 과목 행 목록 -->
        <div id="grade-rows" class="space-y-3 mb-4"></div>

        <!-- 과목 추가 버튼 -->
        <button type="button" onclick="addRow()"
                class="w-full py-2.5 border-2 border-dashed border-green-300 text-green-600 rounded-xl text-sm font-medium hover:bg-green-50 transition-colors mb-5">
            + 과목 추가
        </button>

        <!-- 저장 / 취소 -->
        <div class="flex gap-3">
            <a href="{% url 'parent_grades' student.pk %}"
               class="flex-1 py-3 bg-white border border-gray-300 text-gray-600 rounded-xl text-sm font-medium text-center hover:bg-gray-50 transition-colors">
                취소
            </a>
            <button type="submit" onclick="prepareSubmit()"
                    class="flex-2 flex-grow-[2] py-3 bg-green-600 text-white rounded-xl text-sm font-bold hover:bg-green-700 transition-colors">
                저장하기
            </button>
        </div>
    </form>

    <!-- 푸터 -->
    <div class="text-center mt-8 text-xs text-gray-400 pb-4">
        <p>엠클래스 수학과학전문학원 · 031-439-1222</p>
    </div>
</div>

{{ subjects_list|json_script:"subjects-data" }}
<script>
const SUBJECTS = JSON.parse(document.getElementById('subjects-data').textContent);

// 실제 DB에 있는 교과 목록으로 동적 생성
const CATS = [...new Set(SUBJECTS.map(s => s.category).filter(Boolean))].sort();

let rowCount = 0;

function categoryOptions() {
    return '<option value="">-- 교과 선택 --</option>' +
        CATS.map(c => `<option value="${c}">${c}</option>`).join('');
}

function subjectOptions(subjects, placeholder) {
    const ph = placeholder || '-- 과목 선택 --';
    return `<option value="">${ph}</option>` +
        subjects.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
}

function addRow() {
    const idx = rowCount++;
    document.getElementById('grade_count').value = rowCount;

    const row = document.createElement('div');
    row.id = `row-${idx}`;
    row.className = 'bg-white rounded-xl shadow-sm border border-gray-100 p-4';
    row.innerHTML = `
        <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-semibold text-gray-500">과목 ${idx + 1}</span>
            <button type="button" onclick="removeRow('row-${idx}')"
                    class="text-red-300 hover:text-red-500 text-xs">✕ 삭제</button>
        </div>

        <!-- 교과 선택 -->
        <div class="mb-3">
            <label class="block text-xs text-gray-500 mb-1">교과 <span class="text-red-500">*</span></label>
            <select class="category-sel w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-green-400 focus:outline-none">
                ${categoryOptions()}
            </select>
        </div>

        <!-- 과목 선택 -->
        <div class="mb-3">
            <label class="block text-xs text-gray-500 mb-1">과목 <span class="text-red-500">*</span></label>
            <select name="grades[${idx}][subject]" required
                    class="subject-sel w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-green-400 focus:outline-none">
                ${subjectOptions([], '← 교과를 먼저 선택하세요')}
            </select>
        </div>

        <!-- 원점수 / 과목평균 / 표준편차 -->
        <div class="grid grid-cols-3 gap-2 mb-3">
            <div>
                <label class="block text-xs text-gray-500 mb-1">원점수 <span class="text-red-500">*</span></label>
                <input type="number" name="grades[${idx}][score]" placeholder="85.0"
                       min="0" max="100" step="0.1" required
                       class="w-full border border-gray-300 rounded-lg px-2 py-2 text-sm text-center focus:ring-2 focus:ring-green-400 focus:outline-none">
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1">과목평균</label>
                <input type="number" name="grades[${idx}][subject_average]" placeholder="72.0"
                       min="0" max="100" step="0.1"
                       class="w-full border border-gray-300 rounded-lg px-2 py-2 text-sm text-center focus:ring-2 focus:ring-green-400 focus:outline-none">
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1">표준편차</label>
                <input type="number" name="grades[${idx}][subject_stddev]" placeholder="15.0"
                       min="0" step="0.1"
                       class="w-full border border-gray-300 rounded-lg px-2 py-2 text-sm text-center focus:ring-2 focus:ring-green-400 focus:outline-none">
            </div>
        </div>

        <!-- 수강자수 / 성취도 / 단위수 -->
        <div class="grid grid-cols-3 gap-2">
            <div>
                <label class="block text-xs text-gray-500 mb-1">수강자수</label>
                <input type="number" name="grades[${idx}][enrolled_count]" placeholder="150"
                       min="1" step="1"
                       class="w-full border border-gray-300 rounded-lg px-2 py-2 text-sm text-center focus:ring-2 focus:ring-green-400 focus:outline-none">
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1">성취도</label>
                <select name="grades[${idx}][achievement_level]"
                        class="w-full border border-gray-300 rounded-lg px-2 py-2.5 text-sm text-center focus:ring-2 focus:ring-green-400 focus:outline-none">
                    <option value="">-</option>
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                    <option value="D">D</option>
                    <option value="E">E</option>
                </select>
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1">단위수</label>
                <input type="number" name="grades[${idx}][credits]" placeholder="3"
                       min="1" step="1"
                       class="w-full border border-gray-300 rounded-lg px-2 py-2 text-sm text-center focus:ring-2 focus:ring-green-400 focus:outline-none">
            </div>
        </div>
    `;
    document.getElementById('grade-rows').appendChild(row);

    const catSel = row.querySelector('.category-sel');
    const subSel = row.querySelector('.subject-sel');
    catSel.addEventListener('change', function() {
        const cat = this.value;
        if (!cat) {
            subSel.innerHTML = subjectOptions([], '← 교과를 먼저 선택하세요');
        } else {
            const filtered = SUBJECTS.filter(s => s.category === cat);
            subSel.innerHTML = subjectOptions(filtered);
        }
    });
}

function removeRow(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
}

function prepareSubmit() {
    document.getElementById('grade_count').value = rowCount;
}

addRow();
</script>
</body>
</html>
