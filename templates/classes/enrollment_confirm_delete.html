{% extends 'classes/base_classes.html' %}

{% block title %}수강 취소 확인 - M'Class Manager{% endblock %}

{% block classes_content %}
<div class="max-w-md mx-auto">
    <div class="bg-white rounded-lg shadow p-6">
        <div class="flex items-center gap-3 mb-4">
            <div class="flex-shrink-0 w-10 h-10 bg-red-100 rounded-full flex items-center justify-center">
                <svg class="w-5 h-5 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
            </div>
            <h1 class="text-lg font-bold text-gray-800">수강 취소</h1>
        </div>
        <p class="text-sm text-gray-600 mb-2">
            <span class="font-semibold text-gray-800">{{ enrollment.student.name }}</span> 학생의
            <span class="font-semibold text-gray-800">{{ lesson.name }}</span> 수강을 취소할까요?
        </p>
        <p class="text-xs text-red-500 mb-6">해당 학생의 납부 기록도 함께 삭제됩니다.</p>
        <div class="flex justify-end gap-3">
            <a href="{% url 'classes:lesson_detail' lesson.pk %}"
               class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg text-sm font-medium transition-colors">
                취소
            </a>
            <form method="post">
                {% csrf_token %}
                <button type="submit"
                        class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg text-sm font-medium transition-colors">
                    수강 취소
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
