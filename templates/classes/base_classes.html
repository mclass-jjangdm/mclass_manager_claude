{% extends 'base.html' %}

{% load static %}

{% block content %}
<div class="space-y-6">
    <!-- 서브 네비게이션 -->
    <div class="bg-white shadow-sm">
        <div class="container mx-auto px-4">
            <nav class="flex space-x-4 overflow-x-auto py-3" aria-label="Classes">
                <a href="{% url 'classes:lesson_list' %}"
                   class="nav-link {% if request.resolver_match.url_name == 'lesson_list' %}active{% endif %}">
                    수업 목록
                </a>
                {% if user.is_staff %}
                <a href="{% url 'classes:lesson_create' %}"
                   class="nav-link {% if request.resolver_match.url_name == 'lesson_create' %}active{% endif %}">
                    수업 개설
                </a>
                <a href="{% url 'classes:monthly_enrollment_list' %}"
                   class="nav-link {% if request.resolver_match.url_name in 'monthly_enrollment_list monthly_enrollment_create monthly_enrollment_edit monthly_enrollment_delete' %}active{% endif %}">
                    월별 수강 신청
                </a>
                {% endif %}
            </nav>
        </div>
    </div>

    <!-- 컨텐츠 영역 -->
    <div class="container mx-auto px-4">
        {% block classes_content %}
        {% endblock %}
    </div>
</div>
{% endblock %}
