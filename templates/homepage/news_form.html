{% extends 'base.html' %}

{% block title %}{{ form_title|default:"입시뉴스 추가" }} - M'Class Manager{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto py-8 px-4">

    <!-- 헤더 -->
    <div class="flex items-center gap-3 mb-6">
        <a href="/manage/news/" class="text-gray-400 hover:text-green-600 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
        </a>
        <h1 class="text-xl font-bold text-gray-800">{{ form_title|default:"입시뉴스 추가" }}</h1>
    </div>

    <!-- URL 스크래핑 카드 -->
    <div class="bg-green-50 border border-green-200 rounded-xl p-5 mb-5">
        <h2 class="text-sm font-semibold text-green-800 mb-3 flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
            </svg>
            URL에서 자동으로 가져오기
        </h2>
        <div class="flex gap-2">
            <input type="url" id="scrape-url"
                   class="flex-1 px-4 py-2.5 border border-green-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 text-sm bg-white"
                   placeholder="https://news.example.com/article/...">
            <button type="button" onclick="scrapeUrl()"
                    class="px-4 py-2.5 bg-green-600 text-white text-sm font-medium rounded-lg hover:bg-green-700 transition-colors flex items-center gap-2 flex-shrink-0">
                <svg id="scrape-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
                </svg>
                <svg id="scrape-spinner" class="w-4 h-4 animate-spin hidden" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                가져오기
            </button>
        </div>
        <p id="scrape-message" class="mt-2 text-xs hidden"></p>
    </div>

    <!-- 폼 카드 -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
        <form method="post" class="space-y-5">
            {% csrf_token %}

            <!-- 제목 -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">제목</label>
                <input type="text" id="form-title" name="title" value="{{ object.title|default:'' }}"
                       class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 text-sm"
                       placeholder="뉴스 제목을 입력하세요" required>
            </div>

            <!-- 출처 -->
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">출처 이름</label>
                    <input type="text" id="form-source-name" name="source_name" value="{{ object.source_name|default:'' }}"
                           class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 text-sm"
                           placeholder="연합뉴스, 교육부 등">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">원문 URL</label>
                    <input type="url" id="form-original-url" name="original_url" value="{{ object.original_url|default:'' }}"
                           class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 text-sm"
                           placeholder="https://...">
                </div>
            </div>

            <!-- 내용 -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">
                    내용
                    <span class="text-gray-400 font-normal text-xs ml-1">(URL에서 가져온 내용을 편집하거나 직접 입력)</span>
                </label>
                <textarea id="form-content" name="content" rows="14"
                          class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 text-sm resize-y"
                          placeholder="뉴스 내용을 입력하세요">{{ object.content|default:'' }}</textarea>
            </div>

            <!-- 공개 여부 -->
            <div>
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" name="is_published"
                           {% if object.is_published or not object %}checked{% endif %}
                           class="w-4 h-4 text-green-600 border-gray-300 rounded focus:ring-green-500">
                    <span class="text-sm text-gray-700">공개</span>
                </label>
            </div>

            <!-- 버튼 -->
            <div class="flex justify-end gap-2 pt-2">
                <a href="/manage/news/"
                   class="px-4 py-2 text-sm text-gray-600 bg-gray-100 rounded-lg hover:bg-gray-200 transition-colors font-medium">
                    취소
                </a>
                <button type="submit"
                        class="px-6 py-2 text-sm font-medium text-white bg-green-600 rounded-lg hover:bg-green-700 transition-colors">
                    저장
                </button>
            </div>
        </form>
    </div>
</div>

<script>
function scrapeUrl() {
    const url = document.getElementById('scrape-url').value.trim();
    if (!url) {
        showMessage('URL을 입력해주세요.', 'error');
        return;
    }

    const icon = document.getElementById('scrape-icon');
    const spinner = document.getElementById('scrape-spinner');
    icon.classList.add('hidden');
    spinner.classList.remove('hidden');

    fetch('/news/scrape/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value,
        },
        body: JSON.stringify({ url: url })
    })
    .then(res => res.json())
    .then(data => {
        icon.classList.remove('hidden');
        spinner.classList.add('hidden');

        if (data.error) {
            showMessage('가져오기 실패: ' + data.error, 'error');
            return;
        }

        if (data.title) document.getElementById('form-title').value = data.title;
        if (data.content) document.getElementById('form-content').value = data.content;
        if (data.source_name) document.getElementById('form-source-name').value = data.source_name;
        if (data.original_url) document.getElementById('form-original-url').value = data.original_url;

        showMessage('내용을 가져왔습니다. 내용을 검토하고 저장하세요.', 'success');
    })
    .catch(err => {
        icon.classList.remove('hidden');
        spinner.classList.add('hidden');
        showMessage('네트워크 오류가 발생했습니다.', 'error');
        console.error(err);
    });
}

function showMessage(text, type) {
    const el = document.getElementById('scrape-message');
    el.textContent = text;
    el.className = 'mt-2 text-xs ' + (type === 'error' ? 'text-red-600' : 'text-green-700');
    el.classList.remove('hidden');
}

document.getElementById('scrape-url').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        e.preventDefault();
        scrapeUrl();
    }
});
</script>
{% endblock %}
