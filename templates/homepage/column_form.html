{% extends 'homepage/base_public.html' %}
{% load static %}

{% block title %}{{ form_title|default:"원장칼럼 작성" }} - 엠클래스{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto py-8 px-4">

    <!-- 헤더 -->
    <div class="flex items-center gap-3 mb-6">
        <a href="/manage/columns/" class="text-gray-400 hover:text-purple-600 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
        </a>
        <h1 class="text-xl font-bold text-gray-800">{{ form_title|default:"원장칼럼 작성" }}</h1>
    </div>

    <!-- 폼 카드 -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
        <form method="post" class="space-y-5">
            {% csrf_token %}

            <!-- 제목 -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">제목</label>
                <input type="text" name="title" value="{{ object.title|default:'' }}"
                       class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 text-sm"
                       placeholder="칼럼 제목을 입력하세요" required>
            </div>

            <!-- 내용 -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">내용</label>
                <textarea name="content" id="id_content"
                          class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm"
                          placeholder="칼럼 내용을 입력하세요">{{ object.content|default:'' }}</textarea>
            </div>

            <!-- 공개 여부 -->
            <div>
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" name="is_published"
                           {% if object.is_published or not object %}checked{% endif %}
                           class="w-4 h-4 text-purple-600 border-gray-300 rounded focus:ring-purple-500">
                    <span class="text-sm text-gray-700">공개</span>
                </label>
            </div>

            <!-- 버튼 -->
            <div class="flex justify-end gap-2 pt-2">
                <a href="/manage/columns/"
                   class="px-4 py-2 text-sm text-gray-600 bg-gray-100 rounded-lg hover:bg-gray-200 transition-colors font-medium">
                    취소
                </a>
                <button type="submit"
                        class="px-6 py-2 text-sm font-medium text-white bg-purple-600 rounded-lg hover:bg-purple-700 transition-colors">
                    저장
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_head %}
<link href="{% static 'summernote/summernote-lite.min.css' %}" rel="stylesheet">
{% endblock %}

{% block extra_js %}
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="{% static 'summernote/summernote-lite.min.js' %}"></script>
<script src="{% static 'summernote/lang/summernote-ko-KR.min.js' %}"></script>
<script>
$(document).ready(function () {
    var csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
    $('#id_content').summernote({
        lang: 'ko-KR',
        height: 400,
        toolbar: [
            ['style',    ['style']],
            ['font',     ['bold', 'underline', 'italic', 'strikethrough', 'clear']],
            ['fontsize', ['fontsize']],
            ['color',    ['color']],
            ['para',     ['ul', 'ol', 'paragraph']],
            ['table',    ['table']],
            ['insert',   ['link', 'picture', 'hr']],
            ['view',     ['fullscreen', 'codeview']],
        ],
        callbacks: {
            onImageUpload: function (files) {
                var data = new FormData();
                data.append('file', files[0]);
                $.ajax({
                    url: '/summernote/upload_attachment/',
                    method: 'POST',
                    headers: { 'X-CSRFToken': csrfToken },
                    data: data, processData: false, contentType: false,
                    success: function (res) {
                        if (res.url) $('#id_content').summernote('insertImage', res.url);
                    }
                });
            }
        }
    });
    $('form').on('submit', function () {
        $('#id_content').val($('#id_content').summernote('code'));
    });
});
</script>
{% endblock %}
