{% extends 'homepage/base_public.html' %}

{% block title %}삭제 확인 - 엠클래스{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto py-16 px-4">
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-8 text-center">
        <!-- 경고 아이콘 -->
        <div class="w-14 h-14 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-5">
            <svg class="w-7 h-7 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
            </svg>
        </div>

        <h1 class="text-lg font-bold text-gray-900 mb-2">정말 삭제하시겠습니까?</h1>
        <p class="text-sm text-gray-500 mb-2">다음 항목을 삭제합니다:</p>
        <p class="text-sm font-semibold text-gray-800 bg-gray-50 rounded-lg px-4 py-3 mb-6">{{ object_title }}</p>
        <p class="text-xs text-red-500 mb-6">이 작업은 되돌릴 수 없습니다.</p>

        <div class="flex gap-3 justify-center">
            <a href="{{ cancel_url }}"
               class="px-6 py-2.5 text-sm font-medium text-gray-600 bg-gray-100 rounded-lg hover:bg-gray-200 transition-colors">
                취소
            </a>
            <form method="post">
                {% csrf_token %}
                <button type="submit"
                        class="px-6 py-2.5 text-sm font-medium text-white bg-red-500 rounded-lg hover:bg-red-600 transition-colors">
                    삭제
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
