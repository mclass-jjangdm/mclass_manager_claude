<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}엠클래스 수학과학전문학원{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
        .prose { line-height: 1.9; }
        .prose p { margin-bottom: 1rem; }
    </style>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">

    <!-- 헤더 네비게이션 -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <!-- 로고 -->
                <a href="/" class="flex items-center gap-2">
                    <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center">
                        <span class="text-white font-bold text-sm">M</span>
                    </div>
                    <span class="font-bold text-gray-800 text-base hidden sm:block">엠클래스 수학과학전문학원</span>
                    <span class="font-bold text-gray-800 text-base sm:hidden">엠클래스</span>
                </a>

                <!-- 데스크탑 메뉴 -->
                <nav class="hidden md:flex items-center gap-6 text-sm font-medium text-gray-600">
                    <a href="/" class="hover:text-indigo-600 transition-colors {% block nav_home %}{% endblock %}">홈</a>
                    <a href="/about/" class="hover:text-indigo-600 transition-colors {% block nav_about %}{% endblock %}">학원소개</a>
                    <a href="/notice/" class="hover:text-indigo-600 transition-colors {% block nav_notice %}{% endblock %}">공지사항</a>
                    <a href="/column/" class="hover:text-indigo-600 transition-colors {% block nav_column %}{% endblock %}">원장칼럼</a>
                    <a href="/news/" class="hover:text-indigo-600 transition-colors {% block nav_news %}{% endblock %}">입시뉴스</a>
                </nav>

                <!-- 모바일 햄버거 -->
                <button type="button" id="mobile-menu-btn"
                        class="md:hidden p-2 rounded-lg text-gray-500 hover:bg-gray-100 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
            </div>

            <!-- 모바일 메뉴 -->
            <nav id="mobile-menu" class="hidden md:hidden pb-3 border-t border-gray-100 pt-3">
                <div class="flex flex-col gap-1 text-sm font-medium">
                    <a href="/" class="px-3 py-2 rounded-lg hover:bg-indigo-50 hover:text-indigo-600 text-gray-700">홈</a>
                    <a href="/about/" class="px-3 py-2 rounded-lg hover:bg-indigo-50 hover:text-indigo-600 text-gray-700">학원소개</a>
                    <a href="/notice/" class="px-3 py-2 rounded-lg hover:bg-indigo-50 hover:text-indigo-600 text-gray-700">공지사항</a>
                    <a href="/column/" class="px-3 py-2 rounded-lg hover:bg-indigo-50 hover:text-indigo-600 text-gray-700">원장칼럼</a>
                    <a href="/news/" class="px-3 py-2 rounded-lg hover:bg-indigo-50 hover:text-indigo-600 text-gray-700">입시뉴스</a>
                </div>
            </nav>
        </div>
    </header>

    <!-- 메인 콘텐츠 -->
    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    <!-- 푸터 -->
    <footer class="bg-gray-800 text-gray-300 mt-16">
        <div class="max-w-5xl mx-auto px-4 py-10">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <div>
                    <div class="flex items-center gap-2 mb-3">
                        <div class="w-7 h-7 bg-indigo-500 rounded-lg flex items-center justify-center">
                            <span class="text-white font-bold text-xs">M</span>
                        </div>
                        <span class="font-bold text-white">엠클래스 수학과학전문학원</span>
                    </div>
                    <p class="text-sm text-gray-400">수학·과학 전문 학원</p>
                </div>
                <div>
                    <h4 class="font-semibold text-white mb-3 text-sm">연락처</h4>
                    <div class="space-y-1 text-sm text-gray-400">
                        <p>📞 <a href="tel:031-439-1222" class="hover:text-white transition-colors">031-439-1222</a></p>
                        <p>✉️ <a href="mailto:jjangdm@mclass.co.kr" class="hover:text-white transition-colors">jjangdm@mclass.co.kr</a></p>
                    </div>
                </div>
                <div>
                    <h4 class="font-semibold text-white mb-3 text-sm">바로가기</h4>
                    <div class="space-y-1 text-sm text-gray-400">
                        <p><a href="/notice/" class="hover:text-white transition-colors">공지사항</a></p>
                        <p><a href="/news/" class="hover:text-white transition-colors">입시뉴스</a></p>
                        <p><a href="https://parents.mclass.co.kr/" class="hover:text-white transition-colors">교재 결제 확인</a></p>
                    </div>
                </div>
            </div>
            <div class="border-t border-gray-700 mt-8 pt-6 text-center text-xs text-gray-500">
                © 2024 엠클래스 수학과학전문학원. All rights reserved.
            </div>
        </div>
    </footer>

    <script>
        // 모바일 메뉴 토글
        document.getElementById('mobile-menu-btn').addEventListener('click', function () {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
