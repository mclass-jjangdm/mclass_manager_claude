{% extends 'homepage/base_public.html' %}

{% block title %}{{ form_title|default:"공지사항 작성" }} - 엠클래스{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto py-8 px-4">

    <!-- 헤더 -->
    <div class="flex items-center gap-3 mb-6">
        <a href="/manage/notices/" class="text-gray-400 hover:text-indigo-600 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
        </a>
        <h1 class="text-xl font-bold text-gray-800">{{ form_title|default:"공지사항 작성" }}</h1>
    </div>

    <!-- 폼 카드 -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
        <form method="post" class="space-y-5">
            {% csrf_token %}

            <!-- 제목 -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">제목</label>
                <input type="text" name="title" value="{{ object.title|default:'' }}"
                       class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm"
                       placeholder="공지사항 제목을 입력하세요" required>
            </div>

            <!-- 내용 -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">내용</label>
                <textarea name="content" id="id_content"
                          class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm"
                          placeholder="공지사항 내용을 입력하세요">{{ object.content|default:'' }}</textarea>
            </div>

            <!-- 공개 여부 -->
            <div class="flex items-center gap-3">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" name="is_published"
                           {% if object.is_published or not object %}checked{% endif %}
                           class="w-4 h-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500">
                    <span class="text-sm text-gray-700">공개</span>
                </label>
            </div>

            <!-- 버튼 -->
            <div class="flex justify-end gap-2 pt-2">
                <a href="/manage/notices/"
                   class="px-4 py-2 text-sm text-gray-600 bg-gray-100 rounded-lg hover:bg-gray-200 transition-colors font-medium">
                    취소
                </a>
                <button type="submit"
                        class="px-6 py-2 text-sm font-medium text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 transition-colors">
                    저장
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.ckeditor.com/ckeditor5/41.4.2/classic/ckeditor.js"></script>
<script src="https://cdn.ckeditor.com/ckeditor5/41.4.2/translations/ko.js"></script>
<script>
ClassicEditor
    .create(document.getElementById('id_content'), {
        language: 'ko',
        toolbar: {
            items: [
                'heading', '|',
                'bold', 'italic', 'underline', 'strikethrough', '|',
                'link', '|',
                'bulletedList', 'numberedList', '|',
                'outdent', 'indent', '|',
                'blockQuote', '|',
                'undo', 'redo'
            ]
        }
    })
    .then(editor => {
        document.querySelector('form').addEventListener('submit', function () {
            document.getElementById('id_content').value = editor.getData();
        });
    })
    .catch(console.error);
</script>
{% endblock %}
