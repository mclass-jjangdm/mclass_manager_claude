{% extends 'homepage/base_public.html' %}

{% block title %}학원 소개 수정 - 엠클래스{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto py-8 px-4">

    <!-- 헤더 -->
    <div class="flex items-center gap-3 mb-6">
        <a href="/about/" class="text-gray-400 hover:text-indigo-600 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
        </a>
        <h1 class="text-xl font-bold text-gray-800">학원 소개 수정</h1>
    </div>

    <!-- 폼 카드 -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
        <form method="post" class="space-y-5">
            {% csrf_token %}

            <!-- 학원명 -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">학원명</label>
                <input type="text" name="academy_name" value="{{ object.academy_name|default:'' }}"
                       class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm"
                       placeholder="엠클래스 수학과학전문학원" required>
            </div>

            <!-- 슬로건 -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">슬로건 / 부제목</label>
                <input type="text" name="subtitle" value="{{ object.subtitle|default:'' }}"
                       class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm"
                       placeholder="수학과 과학을 제대로 배우는 곳">
            </div>

            <!-- 학원 소개 -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">학원 소개</label>
                <textarea name="intro_text" id="id_intro_text"
                          class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm"
                          placeholder="학원 소개 내용을 입력하세요">{{ object.intro_text|default:'' }}</textarea>
            </div>

            <!-- 교육 비전 -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">교육 비전</label>
                <textarea name="vision_text" id="id_vision_text"
                          class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm"
                          placeholder="교육 비전 및 목표를 입력하세요">{{ object.vision_text|default:'' }}</textarea>
            </div>

            <hr class="border-gray-100">

            <!-- 연락처 정보 -->
            <h3 class="text-sm font-semibold text-gray-700">연락처 정보</h3>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">주소</label>
                <input type="text" name="address" value="{{ object.address|default:'' }}"
                       class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm"
                       placeholder="경기도 안산시 단원구 ...">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">전화번호</label>
                    <input type="text" name="phone" value="{{ object.phone|default:'' }}"
                           class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm"
                           placeholder="031-439-1222">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">이메일</label>
                    <input type="email" name="email" value="{{ object.email|default:'' }}"
                           class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm"
                           placeholder="admin@mclass.co.kr">
                </div>
            </div>

            <!-- 버튼 -->
            <div class="flex justify-end gap-2 pt-2">
                <a href="/about/"
                   class="px-4 py-2 text-sm text-gray-600 bg-gray-100 rounded-lg hover:bg-gray-200 transition-colors font-medium">
                    취소
                </a>
                <button type="submit"
                        class="px-6 py-2 text-sm font-medium text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 transition-colors">
                    저장
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.ckeditor.com/ckeditor5/41.4.2/classic/ckeditor.js"></script>
<script src="https://cdn.ckeditor.com/ckeditor5/41.4.2/translations/ko.js"></script>
<script>
const form = document.querySelector('form');
let introEditor, visionEditor;

ClassicEditor
    .create(document.getElementById('id_intro_text'), {
        language: 'ko',
        toolbar: {
            items: [
                'heading', '|',
                'bold', 'italic', 'underline', 'strikethrough', '|',
                'link', '|',
                'bulletedList', 'numberedList', '|',
                'outdent', 'indent', '|',
                'blockQuote', '|',
                'undo', 'redo'
            ]
        }
    })
    .then(editor => {
        introEditor = editor;
    })
    .catch(console.error);

ClassicEditor
    .create(document.getElementById('id_vision_text'), {
        language: 'ko',
        toolbar: {
            items: [
                'heading', '|',
                'bold', 'italic', 'underline', '|',
                'bulletedList', 'numberedList', '|',
                'blockQuote', '|',
                'undo', 'redo'
            ]
        }
    })
    .then(editor => {
        visionEditor = editor;
    })
    .catch(console.error);

form.addEventListener('submit', function () {
    if (introEditor)  document.getElementById('id_intro_text').value  = introEditor.getData();
    if (visionEditor) document.getElementById('id_vision_text').value = visionEditor.getData();
});
</script>
{% endblock %}
