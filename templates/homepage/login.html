{% extends 'homepage/base_public.html' %}

{% block title %}관리자 로그인 - 엠클래스{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center px-4 py-16">
    <div class="w-full max-w-sm">

        <!-- 아이콘 + 제목 -->
        <div class="text-center mb-8">
            <div class="w-14 h-14 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-7 h-7 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                </svg>
            </div>
            <h1 class="text-xl font-bold text-gray-900">관리자 로그인</h1>
            <p class="text-sm text-gray-500 mt-1">홈페이지 콘텐츠 관리용</p>
        </div>

        <!-- 에러 메시지 -->
        {% if form.errors %}
        <div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-4 py-3 mb-5">
            아이디 또는 비밀번호가 올바르지 않습니다.
        </div>
        {% endif %}

        <!-- 로그인 폼 -->
        <form method="post" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 space-y-4">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">아이디</label>
                <input type="text" name="username" autofocus autocomplete="username"
                       class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm
                              focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
                       placeholder="관리자 아이디">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">비밀번호</label>
                <input type="password" name="password" autocomplete="current-password"
                       class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm
                              focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
                       placeholder="비밀번호">
            </div>

            <button type="submit"
                    class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold
                           rounded-lg transition-colors mt-2">
                로그인
            </button>
        </form>

        <p class="text-center text-xs text-gray-400 mt-5">
            <a href="/" class="hover:text-gray-600 transition-colors">← 홈페이지로 돌아가기</a>
        </p>

    </div>
</div>
{% endblock %}
