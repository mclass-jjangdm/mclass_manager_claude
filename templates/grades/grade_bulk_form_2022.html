{% extends 'students/base_students.html' %}

{% block student_content %}

<div class="max-w-7xl mx-auto">
    <div class="bg-white rounded-lg shadow p-6">
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-gray-800">
                한 학기 내신 성적 일괄 입력
                <span class="text-sm font-normal text-indigo-600 bg-indigo-50 px-2 py-1 rounded-full ml-2">2022 개정교육과정</span>
            </h1>
            <p class="text-gray-600 mt-2">학생: <span class="font-semibold">{{ student.name }}</span></p>
        </div>

        <form method="post" id="bulk-grade-form" class="space-y-6">
            {% csrf_token %}

            <!-- 학년/학기 선택 -->
            <div class="bg-indigo-50 border-l-4 border-indigo-500 p-4 rounded-r-lg">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-indigo-900 mb-2">학년 *</label>
                        <select id="common-year" required
                                class="w-full px-3 py-2 border border-indigo-300 rounded-md focus:ring-2 focus:ring-indigo-500">
                            <option value="">---------</option>
                            <option value="1">1학년</option>
                            <option value="2">2학년</option>
                            <option value="3">3학년</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-indigo-900 mb-2">학기 *</label>
                        <div class="flex space-x-4 pt-2">
                            <label class="inline-flex items-center cursor-pointer">
                                <input type="radio" name="common_semester" value="1" required class="w-4 h-4 text-indigo-600">
                                <span class="ml-2 text-sm font-medium text-indigo-900">1학기</span>
                            </label>
                            <label class="inline-flex items-center cursor-pointer">
                                <input type="radio" name="common_semester" value="2" class="w-4 h-4 text-indigo-600">
                                <span class="ml-2 text-sm font-medium text-indigo-900">2학기</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 과목별 성적 입력 테이블 -->
            <div class="overflow-x-auto">
                <table class="w-full divide-y divide-gray-200 border text-sm">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-2 py-3 text-left text-xs font-medium text-gray-600 uppercase w-28">교과</th>
                            <th class="px-2 py-3 text-left text-xs font-medium text-gray-600 uppercase">과목 *</th>
                            <th class="px-2 py-3 text-center text-xs font-medium text-gray-600 uppercase w-16">단위수 *</th>
                            <th class="px-2 py-3 text-center text-xs font-medium text-gray-600 uppercase w-20">점수 *</th>
                            <th class="px-2 py-3 text-center text-xs font-medium text-gray-600 uppercase w-16">성취도</th>
                            <th class="px-2 py-3 text-center text-xs font-medium text-gray-600 uppercase w-16">석차</th>
                            <th class="px-2 py-3 text-center text-xs font-medium text-gray-600 uppercase w-16">동석차수</th>
                            <th class="px-2 py-3 text-center text-xs font-medium text-gray-600 uppercase w-20">수강자수 *</th>
                            <th class="px-2 py-3 text-center text-xs font-medium text-gray-600 uppercase w-18">백분위(%)</th>
                            <th class="px-2 py-3 text-center text-xs font-medium text-gray-600 uppercase w-20">상대등급</th>
                            <th class="px-2 py-3 text-center text-xs font-medium text-gray-600 uppercase w-12">삭제</th>
                        </tr>
                    </thead>
                    <tbody id="grades-tbody" class="bg-white divide-y divide-gray-200">
                    </tbody>
                </table>
            </div>

            <!-- 과목 추가 버튼 -->
            <div>
                <button type="button" onclick="addRow()"
                        class="px-4 py-2 bg-green-500 hover:bg-green-600 text-white rounded-md text-sm font-medium transition-colors">
                    + 과목 추가
                </button>
            </div>

            <!-- 제출 버튼 -->
            <div class="flex justify-end space-x-3 pt-4 border-t">
                <a href="{% url 'students:student_detail' student.pk %}"
                   class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50">
                    취소
                </a>
                <button type="submit"
                        class="px-4 py-2 bg-indigo-500 hover:bg-indigo-600 text-white rounded-md text-sm font-medium transition-colors">
                    일괄 등록
                </button>
            </div>
        </form>
    </div>
</div>

{{ subjects_list|json_script:"subjects-data" }}
<script>
// 서버에서 전달된 2022 과목 목록
const ALL_SUBJECTS = JSON.parse(document.getElementById('subjects-data').textContent);

// 교과 목록 (고정값 — 2022 교육과정 교과군)
const CATEGORIES = [
    '국어', '수학', '영어', '사회(역사/도덕 포함)', '과학',
    '기술가정/정보', '체육', '예술', '제2외국어/한문', '교양'
];

function buildCategoryOptions() {
    return '<option value="">-- 교과 선택 --</option>' +
           CATEGORIES.map(function(c) { return '<option value="' + c + '">' + c + '</option>'; }).join('');
}

function buildSubjectOptions(subjects) {
    return '<option value="">-- 과목 선택 --</option>' +
           subjects.map(function(s) { return '<option value="' + s.id + '">' + s.name + '</option>'; }).join('');
}

function addRow() {
    const tbody = document.getElementById('grades-tbody');
    const tr = document.createElement('tr');
    tr.className = 'grade-row';
    tr.innerHTML =
        '<td class="px-2 py-2">' +
            '<select class="category-select w-full px-1.5 py-1.5 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500 text-sm">' +
                buildCategoryOptions() +
            '</select>' +
        '</td>' +
        '<td class="px-2 py-2">' +
            '<select name="subject" required class="subject-select w-full px-1.5 py-1.5 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500 text-sm">' +
                buildSubjectOptions(ALL_SUBJECTS) +
            '</select>' +
        '</td>' +
        '<td class="px-2 py-2"><input type="number" name="credits" min="1" step="1" required class="w-full px-1.5 py-1.5 border border-gray-300 rounded text-sm text-center" placeholder="3"></td>' +
        '<td class="px-2 py-2"><input type="number" name="score" min="0" max="100" step="0.1" required class="w-full px-1.5 py-1.5 border border-gray-300 rounded text-sm text-center" placeholder="95.0"></td>' +
        '<td class="px-2 py-2">' +
            '<select name="achievement_level" class="w-full px-1.5 py-1.5 border border-gray-300 rounded text-sm text-center">' +
                '<option value="">-</option><option value="A">A</option><option value="B">B</option><option value="C">C</option>' +
            '</select>' +
        '</td>' +
        '<td class="px-2 py-2"><input type="number" name="subject_rank" min="1" step="1" class="w-full px-1.5 py-1.5 border border-gray-300 rounded text-sm text-center" placeholder="-"></td>' +
        '<td class="px-2 py-2"><input type="number" name="same_rank_count" min="1" step="1" class="w-full px-1.5 py-1.5 border border-gray-300 rounded text-sm text-center" placeholder="-"></td>' +
        '<td class="px-2 py-2"><input type="number" name="enrolled_count" min="1" step="1" required class="w-full px-1.5 py-1.5 border border-gray-300 rounded text-sm text-center" placeholder="150"></td>' +
        '<td class="px-2 py-2"><input type="number" name="percentile" min="0" max="100" step="0.1" class="w-full px-1.5 py-1.5 border border-gray-300 rounded text-sm text-center" placeholder="-"></td>' +
        '<td class="px-2 py-2">' +
            '<select name="grade_rank" class="w-full px-1.5 py-1.5 border border-gray-300 rounded text-sm text-center">' +
                '<option value="">-</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option>' +
            '</select>' +
        '</td>' +
        '<td class="px-2 py-2 text-center">' +
            '<button type="button" onclick="removeRow(this)" class="text-red-500 hover:text-red-700 text-sm font-medium">삭제</button>' +
        '</td>';

    tbody.appendChild(tr);

    // 교과 선택 시 과목 클라이언트 필터링
    var catSel = tr.querySelector('.category-select');
    var subSel = tr.querySelector('.subject-select');
    catSel.addEventListener('change', function() {
        var cat = this.value;
        var filtered = cat ? ALL_SUBJECTS.filter(function(s) { return s.category === cat; }) : ALL_SUBJECTS;
        subSel.innerHTML = buildSubjectOptions(filtered);
    });
}

function removeRow(btn) {
    var tbody = document.getElementById('grades-tbody');
    if (tbody.querySelectorAll('.grade-row').length <= 1) {
        alert('최소 1개의 과목은 입력해야 합니다.');
        return;
    }
    btn.closest('tr').remove();
}

document.getElementById('bulk-grade-form').addEventListener('submit', function(e) {
    e.preventDefault();

    var year = document.getElementById('common-year').value;
    var semesterEl = document.querySelector('input[name="common_semester"]:checked');
    if (!year || !semesterEl) {
        alert('학년과 학기를 선택해주세요.');
        return;
    }

    var rows = document.querySelectorAll('.grade-row');
    var formData = new FormData();
    formData.append('year', year);
    formData.append('semester', semesterEl.value);

    var count = 0;
    rows.forEach(function(row) {
        var subject = row.querySelector('select[name="subject"]').value;
        var score = row.querySelector('input[name="score"]').value;
        var credits = row.querySelector('input[name="credits"]').value;
        var enrolled = row.querySelector('input[name="enrolled_count"]').value;
        if (!subject || !score || !credits || !enrolled) return;

        formData.append('grades[' + count + '][subject]', subject);
        formData.append('grades[' + count + '][credits]', credits);
        formData.append('grades[' + count + '][score]', score);
        formData.append('grades[' + count + '][enrolled_count]', enrolled);
        formData.append('grades[' + count + '][achievement_level]', row.querySelector('select[name="achievement_level"]').value);
        formData.append('grades[' + count + '][subject_rank]', row.querySelector('input[name="subject_rank"]').value);
        formData.append('grades[' + count + '][same_rank_count]', row.querySelector('input[name="same_rank_count"]').value);
        formData.append('grades[' + count + '][percentile]', row.querySelector('input[name="percentile"]').value);
        formData.append('grades[' + count + '][grade_rank]', row.querySelector('select[name="grade_rank"]').value);
        count++;
    });

    if (count === 0) {
        alert('최소 1개 이상의 과목 성적을 입력해주세요.\n과목, 점수, 단위수, 수강자수는 필수입니다.');
        return;
    }

    formData.append('grade_count', count);

    fetch(window.location.href, {
        method: 'POST',
        body: formData,
        headers: { 'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value }
    }).then(function(response) {
        if (response.redirected) {
            window.location.href = response.url;
        } else if (response.ok) {
            window.location.href = '{% url "students:student_detail" student.pk %}';
        } else {
            response.text().then(function(t) { alert('저장 오류가 발생했습니다.'); });
        }
    }).catch(function(err) { alert('오류: ' + err); });
});

// 초기 1행 추가
addRow();
</script>

{% endblock %}
