{% extends 'students/base_students.html' %}

{% block student_content %}

<div class="max-w-7xl mx-auto">
    <div class="bg-white rounded-lg shadow p-6">
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-gray-800">
                한 학기 내신 성적 입력
                <span class="text-sm font-normal text-green-600 bg-green-50 px-2 py-1 rounded-full ml-2">중학교</span>
            </h1>
            <p class="text-gray-600 mt-2">학생: <span class="font-semibold">{{ student.name }}</span></p>
        </div>

        <form method="post" id="bulk-grade-form" class="space-y-6">
            {% csrf_token %}

            <!-- 학년/학기 선택 -->
            <div class="bg-green-50 border-l-4 border-green-500 p-4 rounded-r-lg">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-green-900 mb-2">학년 *</label>
                        <select id="common-year" required
                                class="w-full px-3 py-2 border border-green-300 rounded-md focus:ring-2 focus:ring-green-500">
                            <option value="">---------</option>
                            <option value="1">1학년</option>
                            <option value="2">2학년</option>
                            <option value="3">3학년</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-green-900 mb-2">학기 *</label>
                        <div class="flex space-x-4 pt-2">
                            <label class="inline-flex items-center cursor-pointer">
                                <input type="radio" name="common_semester" value="1" required class="w-4 h-4 text-green-600">
                                <span class="ml-2 text-sm font-medium text-green-900">1학기</span>
                            </label>
                            <label class="inline-flex items-center cursor-pointer">
                                <input type="radio" name="common_semester" value="2" class="w-4 h-4 text-green-600">
                                <span class="ml-2 text-sm font-medium text-green-900">2학기</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 과목별 성적 입력 테이블 -->
            <div class="overflow-x-auto">
                <table class="w-full divide-y divide-gray-200 border text-sm">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-2 py-3 text-left text-xs font-medium text-gray-600 uppercase w-28">교과</th>
                            <th class="px-2 py-3 text-left text-xs font-medium text-gray-600 uppercase">과목 *</th>
                            <th class="px-2 py-3 text-center text-xs font-medium text-gray-600 uppercase w-20">원점수 *</th>
                            <th class="px-2 py-3 text-center text-xs font-medium text-gray-600 uppercase w-20">과목평균</th>
                            <th class="px-2 py-3 text-center text-xs font-medium text-gray-600 uppercase w-20">표준편차</th>
                            <th class="px-2 py-3 text-center text-xs font-medium text-gray-600 uppercase w-20">수강자수</th>
                            <th class="px-2 py-3 text-center text-xs font-medium text-gray-600 uppercase w-20">성취도</th>
                            <th class="px-2 py-3 text-center text-xs font-medium text-gray-600 uppercase w-12">삭제</th>
                        </tr>
                    </thead>
                    <tbody id="grades-tbody" class="bg-white divide-y divide-gray-200">
                    </tbody>
                </table>
            </div>

            <!-- 과목 추가 버튼 -->
            <div>
                <button type="button" onclick="addRow()"
                        class="px-4 py-2 bg-green-500 hover:bg-green-600 text-white rounded-md text-sm font-medium transition-colors">
                    + 과목 추가
                </button>
            </div>

            <!-- 제출 버튼 -->
            <div class="flex justify-end space-x-3 pt-4 border-t">
                <a href="{% url 'students:student_detail' student.pk %}"
                   class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50">
                    취소
                </a>
                <button type="submit"
                        class="px-4 py-2 bg-green-500 hover:bg-green-600 text-white rounded-md text-sm font-medium transition-colors">
                    등록
                </button>
            </div>
        </form>
    </div>
</div>

{{ subjects_list|json_script:"subjects-data" }}
<script>
const ALL_SUBJECTS = JSON.parse(document.getElementById('subjects-data').textContent);

const CATEGORIES = [
    '국어', '수학', '영어', '사회', '역사', '도덕', '과학',
    '기술·가정', '정보', '체육', '음악', '미술', '영어', '한문', '기타'
];

function buildCategoryOptions() {
    const cats = [...new Set(ALL_SUBJECTS.map(s => s.category).filter(Boolean))].sort();
    return '<option value="">-- 교과 선택 --</option>' +
           cats.map(c => '<option value="' + c + '">' + c + '</option>').join('');
}

function buildSubjectOptions(subjects) {
    return '<option value="">-- 과목 선택 --</option>' +
           subjects.map(s => '<option value="' + s.id + '">' + s.name + '</option>').join('');
}

function addRow() {
    const tbody = document.getElementById('grades-tbody');
    const tr = document.createElement('tr');
    tr.className = 'grade-row';
    tr.innerHTML =
        '<td class="px-2 py-2">' +
            '<select class="category-select w-full px-1.5 py-1.5 border border-gray-300 rounded focus:ring-2 focus:ring-green-500 text-sm">' +
                buildCategoryOptions() +
            '</select>' +
        '</td>' +
        '<td class="px-2 py-2">' +
            '<select name="subject" required class="subject-select w-full px-1.5 py-1.5 border border-gray-300 rounded focus:ring-2 focus:ring-green-500 text-sm">' +
                '<option value="">← 교과 선택 후</option>' +
            '</select>' +
        '</td>' +
        '<td class="px-2 py-2"><input type="number" name="score" min="0" max="100" step="0.1" required class="w-full px-1.5 py-1.5 border border-gray-300 rounded text-sm text-center" placeholder="85.0"></td>' +
        '<td class="px-2 py-2"><input type="number" name="subject_average" min="0" max="100" step="0.1" class="w-full px-1.5 py-1.5 border border-gray-300 rounded text-sm text-center" placeholder="72.0"></td>' +
        '<td class="px-2 py-2"><input type="number" name="subject_stddev" min="0" step="0.1" class="w-full px-1.5 py-1.5 border border-gray-300 rounded text-sm text-center" placeholder="15.0"></td>' +
        '<td class="px-2 py-2"><input type="number" name="enrolled_count" min="1" step="1" class="w-full px-1.5 py-1.5 border border-gray-300 rounded text-sm text-center" placeholder="150"></td>' +
        '<td class="px-2 py-2">' +
            '<select name="achievement_level" class="w-full px-1.5 py-1.5 border border-gray-300 rounded text-sm text-center">' +
                '<option value="">-</option><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option><option value="E">E</option>' +
            '</select>' +
        '</td>' +
        '<td class="px-2 py-2 text-center">' +
            '<button type="button" onclick="removeRow(this)" class="text-red-500 hover:text-red-700 text-sm font-medium">삭제</button>' +
        '</td>';

    tbody.appendChild(tr);

    var catSel = tr.querySelector('.category-select');
    var subSel = tr.querySelector('.subject-select');
    catSel.addEventListener('change', function() {
        var cat = this.value;
        var filtered = cat ? ALL_SUBJECTS.filter(function(s) { return s.category === cat; }) : ALL_SUBJECTS;
        subSel.innerHTML = buildSubjectOptions(filtered);
    });
}

function removeRow(btn) {
    var tbody = document.getElementById('grades-tbody');
    if (tbody.querySelectorAll('.grade-row').length <= 1) {
        alert('최소 1개의 과목은 입력해야 합니다.');
        return;
    }
    btn.closest('tr').remove();
}

document.getElementById('bulk-grade-form').addEventListener('submit', function(e) {
    e.preventDefault();

    var year = document.getElementById('common-year').value;
    var semesterEl = document.querySelector('input[name="common_semester"]:checked');
    if (!year || !semesterEl) {
        alert('학년과 학기를 선택해주세요.');
        return;
    }

    var rows = document.querySelectorAll('.grade-row');
    var formData = new FormData();
    formData.append('year', year);
    formData.append('semester', semesterEl.value);

    var count = 0;
    rows.forEach(function(row) {
        var subject = row.querySelector('select[name="subject"]').value;
        var score = row.querySelector('input[name="score"]').value;
        if (!subject || !score) return;

        formData.append('grades[' + count + '][subject]', subject);
        formData.append('grades[' + count + '][score]', score);
        formData.append('grades[' + count + '][subject_average]', row.querySelector('input[name="subject_average"]').value);
        formData.append('grades[' + count + '][subject_stddev]', row.querySelector('input[name="subject_stddev"]').value);
        formData.append('grades[' + count + '][enrolled_count]', row.querySelector('input[name="enrolled_count"]').value);
        formData.append('grades[' + count + '][achievement_level]', row.querySelector('select[name="achievement_level"]').value);
        count++;
    });

    if (count === 0) {
        alert('최소 1개 이상의 과목 성적을 입력해주세요.\n과목과 원점수는 필수입니다.');
        return;
    }

    formData.append('grade_count', count);

    fetch(window.location.href, {
        method: 'POST',
        body: formData,
        headers: { 'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value }
    }).then(function(response) {
        if (response.redirected) {
            window.location.href = response.url;
        } else if (response.ok) {
            window.location.href = '{% url "students:student_detail" student.pk %}';
        } else {
            alert('저장 오류가 발생했습니다.');
        }
    }).catch(function(err) { alert('오류: ' + err); });
});

addRow();
</script>

{% endblock %}
